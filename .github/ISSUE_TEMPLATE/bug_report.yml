name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. This integration is unofficial and tested on one heating system: a report about another
        model or software version is how it learns about them. Please never paste a password, a token or the address
        of your installation.
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Settings → Devices & services → Weishaupt → the version shown, or the release you installed.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: definitions
    attributes:
      label: Definitions release loaded in ebusd
      description: The `weishaupt-…` release of ebusd-configuration (the panel's Definitions page shows it).
      placeholder: "0.5.13"
    validations:
      required: true
  - type: input
    id: ebusd
    attributes:
      label: ebusd version and build
      description: Official, or the build of aghulas/ebusd (needed for writes).
      placeholder: "26.1 (aghulas/ebusd build)"
  - type: input
    id: homeassistant
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.2"
    validations:
      required: true
  - type: textarea
    id: equipment
    attributes:
      label: Equipment on the bus
      description: Boilers, system manager, heating modules, room units, with their software versions if known.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & services → Weishaupt → ⋮ → Download diagnostics, then drag the file here. It holds no
        address of ebusd, no file path and no user id (they are redacted), but it does hold the values read from your
        boilers: look at it before you attach it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: >-
        Lines of `custom_components.weishaupt` from Settings → System → Logs. For more detail, add
        `custom_components.weishaupt: debug` under `logger:` → `logs:` in configuration.yaml for a while.
      render: text
