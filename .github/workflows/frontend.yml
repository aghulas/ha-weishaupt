name: Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    name: panel (tests, build, committed build up to date)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The committed build is the one these sources and the lock file give
        run: git diff --exit-code -- ../custom_components/weishaupt/frontend/dist
