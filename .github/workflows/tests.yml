name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly: a new Home Assistant or ebusd assumption that breaks shows up without a commit

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Home Assistant pinned by requirements_test.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/weishaupt --cov-report=term-missing --cov-fail-under=95
      - name: Translations are those generated from the metadata
        run: python scripts/vendor_metadata.py --check
