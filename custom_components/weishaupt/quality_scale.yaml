# Integration quality scale of Home Assistant, as a checklist. A custom integration is not graded; the rules
# are followed where they apply. Status: done, todo, or exempt with the reason.
rules:
  # Bronze
  action-setup:
    status: done
    comment: The action set_program is registered in async_setup, whatever the entries.
  appropriate-polling:
    status: done
    comment: >-
      Own paced reader instead of a fixed update interval: one request at a time, a gap between requests, an
      interval per class of message, only messages of enabled entities. The intervals are choices (README).
  brands:
    status: done
    comment: Own images in brand/; nothing submitted to the brands repository.
  common-modules:
    status: done
    comment: entity.py holds the base entity; hub.py takes the place of coordinator.py (see appropriate-polling).
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirement; the ebusd client is part of the integration.
  docs-actions:
    status: done
    comment: README, section Weekly programs; services.yaml with translations.
  docs-conditions:
    status: exempt
    comment: No condition.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No trigger.
  entity-event-setup:
    status: done
    comment: Entities subscribe to the hub in async_added_to_hass and unsubscribe on removal.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: >-
      Unique id host:port, as in 0.1 (ebusd has no serial number). The same ebusd reached under two host
      names is not detected.
  # Silver
  action-exceptions:
    status: done
    comment: >-
      set_program raises ServiceValidationError or HomeAssistantError with translated messages; setting a number raises ServiceValidationError (refused by the guard, confirmation
      pending) or HomeAssistantError (write failed, not taken over), with translated messages.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: ebusd has no authentication.
  test-coverage:
    status: done
    comment: 97 % of the statements, measured by the test workflow (pytest --cov); the rule asks for more than 95 %.
  # Gold, the rules already met or looked at
  devices: done
  diagnostics: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: 156 of 338 entities are enabled when created; settings, weekly programs and diagnostics are not.
  entity-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      A device missing from the bus for 7 days gets a repair offering its removal; only the user's confirmation
      removes it (devices.py). It can also be deleted by hand at any time.
  dynamic-devices:
    status: done
    comment: >-
      ebusd's info is read every 10 minutes (nothing on the bus); a known device that now answers reloads the entry
      once, which adds its entities (devices.py).
  discovery:
    status: exempt
    comment: ebusd announces itself by no discovery protocol.
  exception-translations: done
  icon-translations:
    status: done
    comment: icons.json, generated with the translations by scripts/vendor_metadata.py and checked in CI.
