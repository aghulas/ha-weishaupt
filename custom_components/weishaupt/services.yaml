set_time_program:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: weishaupt
          domain: sensor
    day:
      required: true
      selector:
        select:
          translation_key: day
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    slots:
      required: true
      example: "06:30-18:00"
      selector:
        text:
set_clock:
  fields:
    align:
      required: false
      default: true
      selector:
        boolean:
